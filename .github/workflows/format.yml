name: Format
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prettier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Prettier
        run: |
          npm install --no-save --no-package-lock prettier@3.3.3 prettier-plugin-java@2.6.4
          npx prettier --write .
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then echo "Already formatted"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Format with Prettier"
          git push
